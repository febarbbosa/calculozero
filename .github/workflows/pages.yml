# ==========================================================================
# Publica o Cálculo Zero no GitHub Pages.
#
# O site é estático e não tem etapa de build obrigatória: o que vai para o ar
# é o próprio repositório. O passo de conferência existe porque o currículo é
# um grafo, e um pré-requisito apontando para id inexistente não dá erro de
# sintaxe — ele só quebra a navegação em silêncio. Melhor pegar aqui.
#
# PRIMEIRA VEZ, UMA VEZ SÓ
# Em Settings → Pages, escolha Source: GitHub Actions. Enquanto isso não for
# feito, este workflow avisa e termina em verde em vez de falhar: o código
# está certo, o que falta é uma configuração do repositório — e falhar por
# isso deixaria um X vermelho permanente em cada commit.
# ==========================================================================
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o grafo do currículo
        run: node tools/validar-curriculo.js

      - name: Preparar o Pages
        id: cfg
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages ainda não está ligado
        if: steps.cfg.outcome != 'success'
        run: |
          echo "::warning title=Pages não configurado::Ative em Settings → Pages com Source: GitHub Actions"
          {
            echo "## O código está pronto — falta ligar o Pages"
            echo ""
            echo "Vá em **Settings → Pages** e escolha **Source: GitHub Actions**."
            echo ""
            echo "Depois disso, rode este workflow de novo (aba Actions → Run workflow)"
            echo "ou faça qualquer commit na \`main\`. O site sobe sozinho."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Empacotar o site
        if: steps.cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        if: steps.cfg.outcome == 'success'
        uses: actions/deploy-pages@v4
